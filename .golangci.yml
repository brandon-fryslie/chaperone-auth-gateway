# golangci-lint v2 configuration for chaperone
version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      # fieldalignment: field order encodes logical grouping; reordering for a
      # few padding bytes on structs allocated a handful of times is the wrong
      # trade. shadow: shadowing err in nested scopes is idiomatic Go.
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    gosec:
      # G304/G306/G301: this is a file-reading proxy — opening config and
      # secret files from user-configured paths and writing logs with
      # operator-chosen permissions is the domain, not a vulnerability.
      excludes:
        - G304
        - G306
        - G301
  exclusions:
    paths:
      - test
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
