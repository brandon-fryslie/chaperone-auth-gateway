# Chaperone configuration for Anthropic API
# Generated by: chaperone init anthropic

[server]
address = "127.0.0.1"
port = 4010

[logging]
level = "info"
format = "json"
output = "stdout"

[services.anthropic]
host_pattern = "api.anthropic.com"
auth_strategy = "header"
credential_ref = "env:ANTHROPIC_API_KEY"
allowed_methods = ["GET", "POST"]
allowed_paths = ["/v1/*"]
max_body_bytes = 10485760  # 10MB
client_groups = ["developers"]

# To use this configuration:
# 1. Set your Anthropic API key: export ANTHROPIC_API_KEY=sk-ant-...
# 2. Start the proxy: chaperone run
# 3. Configure your application to use proxy: export HTTPS_PROXY=http://127.0.0.1:4010
# 4. Make requests to api.anthropic.com - credentials will be injected automatically
