# Chaperone configuration for OpenAI API
# Generated by: chaperone init openai

[server]
address = "127.0.0.1"
port = 4010

[logging]
level = "info"
format = "json"
output = "stdout"

[services.openai]
host_pattern = "api.openai.com"
auth_strategy = "bearer"
credential_ref = "env:OPENAI_API_KEY"
allowed_methods = ["GET", "POST"]
allowed_paths = ["/v1/*"]
max_body_bytes = 10485760  # 10MB
client_groups = ["developers"]

# To use this configuration:
# 1. Set your OpenAI API key: export OPENAI_API_KEY=sk-...
# 2. Start the proxy: chaperone run
# 3. Configure your application to use proxy: export HTTPS_PROXY=http://127.0.0.1:4010
# 4. Make requests to api.openai.com - credentials will be injected automatically
