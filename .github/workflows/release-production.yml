name: Release Production

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
      dry_run:
        description: 'Dry run (skip actual release)'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: make test-race

    - name: Run linting
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag_name: ${{ steps.semver.outputs.tag_name }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get latest release
      id: latest_release
      run: |
        # Get the latest non-prerelease tag
        LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest release tag: $LATEST_TAG"

    - name: Calculate next version
      id: semver
      uses: JasonEtco/increment-semver@v1
      with:
        current-version: ${{ steps.latest_release.outputs.latest_tag }}
        release-type: ${{ github.event.inputs.release_type || 'patch' }}

    - name: Set version outputs
      run: |
        VERSION="${{ steps.semver.outputs.version }}"
        TAG_NAME="v$VERSION"

        # Check if this should be a prerelease
        if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref }}" != "refs/heads/master" ]]; then
          IS_PRERELEASE=true
          TAG_NAME="$TAG_NAME-${{ github.ref_name }}"
        else
          IS_PRERELEASE=false
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

        echo "Next version: $VERSION"
        echo "Tag name: $TAG_NAME"
        echo "Is prerelease: $IS_PRERELEASE"

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, version]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows ARM64 is less common, exclude if needed
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist

        # Determine binary name based on OS and architecture
        BINARY_NAME="chaperone"
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="chaperone.exe"
        fi

        # Add suffix for different architectures
        if [ "$GOARCH" = "arm64" ]; then
          BINARY_NAME="${BINARY_NAME}-arm64"
        elif [ "$GOARCH" = "amd64" ]; then
          BINARY_NAME="${BINARY_NAME}-amd64"
        fi

        # Build with version info
        go build \
          -ldflags "-X main.version=v${{ needs.version.outputs.version }} -X main.commit=${{ github.sha }} -X main.date=$(date +%Y-%m-%d)" \
          -o dist/${BINARY_NAME} \
          ./cmd/chaperone

        # Create tarball (or zip for Windows)
        if [ "$GOOS" = "windows" ]; then
          ARCHIVE_NAME="chaperone-v${{ needs.version.outputs.version }}-${GOOS}-${GOARCH}.zip"
          cd dist && zip -r ${ARCHIVE_NAME} ${BINARY_NAME} && cd ..
        else
          ARCHIVE_NAME="chaperone-v${{ needs.version.outputs.version }}-${GOOS}-${GOARCH}.tar.gz"
          tar -czf dist/${ARCHIVE_NAME} -C dist ${BINARY_NAME}
        fi

        # Generate checksum
        if [ "$GOOS" = "windows" ]; then
          cd dist
          sha256sum ${ARCHIVE_NAME} > ${ARCHIVE_NAME}.sha256
          cd ..
        else
          sha256sum dist/${ARCHIVE_NAME} > dist/${ARCHIVE_NAME}.sha256
        fi

        # Save artifact names
        echo "binary_name=${BINARY_NAME}" >> $GITHUB_ENV
        echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_ENV

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chaperone-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          dist/chaperone-v${{ needs.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  release:
    name: Create Production Release
    runs-on: ubuntu-latest
    needs: [build, version]
    if: github.event.inputs.dry_run != 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "*.tar.gz" -o -name "*.zip" | xargs -I {} cp {} release-assets/
        find artifacts -name "*.sha256" | xargs -I {} cp {} release-assets/
        ls -la release-assets/

    - name: Create Release Tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ needs.version.outputs.tag_name }} -m "Release ${{ needs.version.outputs.version }}"
        git push origin ${{ needs.version.outputs.tag_name }}

    - name: Generate Release Notes
      id: release_notes
      run: |
        # Get commit history since last release
        LAST_TAG=$(git describe --tags --abbrev=0 ${{ needs.version.outputs.tag_name }}^ 2>/dev/null || echo "")

        if [ -n "$LAST_TAG" ]; then
          echo "## Changes since $LAST_TAG" > release_notes.md
          echo "" >> release_notes.md
          git log --pretty=format:"- %s (%h)" $LAST_TAG..${{ needs.version.outputs.tag_name }} >> release_notes.md
        else
          echo "## Initial Release" > release_notes.md
          echo "" >> release_notes.md
          echo "First stable release of Chaperone Auth Gateway." >> release_notes.md
        fi

        # Add installation instructions
        echo "" >> release_notes.md
        echo "## Installation" >> release_notes.md
        echo "" >> release_notes.md
        echo "Download the appropriate binary for your platform:" >> release_notes.md
        echo "- **Linux x64**: \`chaperone-v${{ needs.version.outputs.version }}-linux-amd64.tar.gz\`" >> release_notes.md
        echo "- **Linux ARM64**: \`chaperone-v${{ needs.version.outputs.version }}-linux-arm64.tar.gz\`" >> release_notes.md
        echo "- **macOS x64**: \`chaperone-v${{ needs.version.outputs.version }}-darwin-amd64.tar.gz\`" >> release_notes.md
        echo "- **macOS ARM64 (Apple Silicon)**: \`chaperone-v${{ needs.version.outputs.version }}-darwin-arm64.tar.gz\`" >> release_notes.md
        echo "- **Windows x64**: \`chaperone-v${{ needs.version.outputs.version }}-windows-amd64.zip\`" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Linux/macOS Installation" >> release_notes.md
        echo '```bash' >> release_notes.md
        echo "tar -xzf chaperone-v${{ needs.version.outputs.version }}-<platform>.tar.gz" >> release_notes.md
        echo "sudo mv chaperone* /usr/local/bin/chaperone" >> release_notes.md
        echo '```' >> release_notes.md
        echo "" >> release_notes.md
        echo "### Windows Installation" >> release_notes.md
        echo '```powershell' >> release_notes.md
        echo "Expand-Archive chaperone-v${{ needs.version.outputs.version }}-windows-amd64.zip" >> release_notes.md
        echo "Move the extracted chaperone.exe to a directory in your PATH" >> release_notes.md
        echo '```' >> release_notes.md
        echo "" >> release_notes.md
        echo "### Verification" >> release_notes.md
        echo "" >> release_notes.md
        echo "Each binary package comes with a SHA256 checksum file. Verify the integrity:" >> release_notes.md
        echo '```bash' >> release_notes.md
        echo "sha256sum -c chaperone-v${{ needs.version.outputs.version }}-<platform>.tar.gz.sha256" >> release_notes.md
        echo '```' >> release_notes.md

        # Save release notes to output
        {
          echo 'release_notes<<EOF'
          cat release_notes.md
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        name: Release v${{ needs.version.outputs.version }}
        body: ${{ steps.release_notes.outputs.release_notes }}
        files: |
          release-assets/*
        draft: false
        prerelease: ${{ needs.version.outputs.is_prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dry-run-summary:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: [build, version]
    if: github.event.inputs.dry_run == 'true'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display dry run information
      run: |
        echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Release Type:** ${{ github.event.inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** ${{ needs.version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Prerelease:** ${{ needs.version.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Built Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        find artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
          echo "- $(basename $file)" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "This was a dry run. No release was created." >> $GITHUB_STEP_SUMMARY
        echo "To create an actual release, run the workflow again without 'Dry run' checked." >> $GITHUB_STEP_SUMMARY