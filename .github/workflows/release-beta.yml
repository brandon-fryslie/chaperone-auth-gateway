name: Release Beta

on:
  push:
    branches: [ main, master ]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: make test-race

    - name: Run linting
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Exclude 32-bit and unsupported combinations
          - goos: darwin
            goarch: arm64
          # You can add more exclusions if needed

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Get version
      id: version
      run: |
        # Get short commit hash
        COMMIT_HASH=$(git rev-parse --short HEAD)
        # Get current date
        BUILD_DATE=$(date +%Y%m%d)
        # Create beta version tag
        VERSION="beta-${BUILD_DATE}-${COMMIT_HASH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist

        # Determine binary name based on OS and architecture
        BINARY_NAME="chaperone"
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="chaperone.exe"
        fi

        # Add suffix for different architectures
        if [ "$GOARCH" = "arm64" ]; then
          BINARY_NAME="${BINARY_NAME}-arm64"
        elif [ "$GOARCH" = "amd64" ]; then
          BINARY_NAME="${BINARY_NAME}-amd64"
        fi

        # Build with version info
        go build \
          -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit_hash }} -X main.date=${{ steps.version.outputs.build_date }}" \
          -o dist/${BINARY_NAME} \
          ./cmd/chaperone

        # Create tarball
        ARCHIVE_NAME="chaperone-${{ steps.version.outputs.version }}-${GOOS}-${GOARCH}.tar.gz"
        tar -czf dist/${ARCHIVE_NAME} -C dist ${BINARY_NAME}

        # Generate checksum
        sha256sum dist/${ARCHIVE_NAME} > dist/${ARCHIVE_NAME}.sha256

        # Save artifact names
        echo "binary_name=${BINARY_NAME}" >> $GITHUB_OUTPUT
        echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chaperone-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          dist/chaperone-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          dist/chaperone-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
        retention-days: 30

  release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date +%Y%m%d)
        VERSION="beta-${BUILD_DATE}-${COMMIT_HASH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
        find artifacts -name "*.sha256" -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Create or Update Beta Tag
      run: |
        # Create or update the 'beta' tag to point to the latest commit
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Delete existing beta tag if it exists
        if git rev-parse --verify refs/tags/beta >/dev/null 2>&1; then
          git push origin :refs/tags/beta || true
        fi

        # Create and push new beta tag
        git tag -f beta ${{ github.sha }}
        git push origin beta -f

    - name: Create Beta Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: beta
        name: Beta Release ${{ steps.version.outputs.version }}
        body: |
          ## Beta Release ${{ steps.version.outputs.version }}

          This is an automated beta release from commit ${{ github.sha }}.

          ### Installation

          Download the appropriate binary for your platform:
          - **Linux x64**: `chaperone-${{ steps.version.outputs.version }}-linux-amd64.tar.gz`
          - **Linux ARM64**: `chaperone-${{ steps.version.outputs.version }}-linux-arm64.tar.gz`
          - **macOS x64**: `chaperone-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz`
          - **macOS ARM64 (Apple Silicon)**: `chaperone-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz`

          Extract and install:
          ```bash
          tar -xzf chaperone-${{ steps.version.outputs.version }}-<platform>.tar.gz
          sudo mv chaperone* /usr/local/bin/chaperone
          ```

          ### Verification

          Each binary package comes with a SHA256 checksum file. Verify the integrity:
          ```bash
          sha256sum -c chaperone-${{ steps.version.outputs.version }}-<platform>.tar.gz.sha256
          ```

          ⚠️ **This is a beta release** - Not recommended for production use.
        files: |
          release-assets/*
        draft: false
        prerelease: true
        target_commitish: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}